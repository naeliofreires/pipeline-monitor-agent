nexla:
  service_key: "${NEXLA_SERVICE_KEY}"
  control_service_key: "${NEXLA_CONTROL_SERVICE_KEY}"
  api_url: "${NEXLA_API_URL}"

monitoring:
  poll_interval_seconds: 300
  notification_lookback_hours: 24
  suppression_window_hours: 2
  state_db_path: "data/state.db"

# Silent Failure detection: a flow whose latest run moved far fewer records than the
# previously observed run, while still looking healthy. Compared run-over-run from Nexla
# org-health volume; see docs/adr/0005-silent-failure-volume-detection.md.
detection:
  volume_threshold_pct: 40        # alert when the latest run drops >= 40% vs the previously observed run
  min_baseline_records: 100       # ignore flows whose baseline is below this (too small/variable)
  flows: []                       # per-flow overrides for flows with high natural variance
#  flows:
#    - flow_id: 789
#      volume_threshold_pct: 60

# Flows that should never trigger an Alert (e.g. high natural variance, known-noisy).
blocklist: []
#  - flow_id: 456
#    reason: "High natural variance — not actionable"

# Slack alert delivery is disabled by default. Enable only with a bot token and
# channel ID (for example via env vars in .env); otherwise alerts print to console.
slack:
  enabled: true
  bot_token: "${SLACK_BOT_TOKEN}"
  channel_id: "${SLACK_CHANNEL_ID}"
  signing_secret: "${SLACK_SIGNING_SECRET}"
  allowed_user_ids: ["U05GCJFSGLU"]
  allowed_team_ids: []
  allowed_channel_ids: []
#  api_url: "https://slack.com/api/chat.postMessage"
#  flow_url_template: "${SLACK_FLOW_URL_TEMPLATE}"  # e.g. "https://dataops.nexla.io/flows/{flow_id}"

controls:
  enabled: true
  require_confirmation: true
  allowed_actions: ["pause","activate"]
  protected_flows: []
  action_ttl_seconds: 900
  interactions_host: "127.0.0.1"
  interactions_port: 8080
  interactions_path: "/slack/interactions"
  commands_path: "/slack/commands"

llm:
  provider: "openai"

opencode:
  model: "big-pickle"
  base_url: "https://opencode.ai/zen/v1"

openai:
  model: "gpt-4.1-mini"
  base_url: "https://api.openai.com/v1"
