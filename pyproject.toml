[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-monitor"
version = "0.1.0"
description = "Day 1 MVP for a read-only Nexla pipeline monitoring agent"
requires-python = ">=3.12"
dependencies = [
  "APScheduler>=3.10,<4",
  "PyYAML>=6.0,<7",
  "openai>=1,<2",
  "nexla-sdk>=1,<2",
  "python-dotenv>=1,<2",
]

[project.scripts]
pipeline-monitor = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "monitor"]

[tool.setuptools.packages.find]
where = ["src"]
